<svg width="200" height="50" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFE103;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC800;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- T: 부분 (노란색) -->
  <text x="0" y="38" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="url(#yellowGlow)" filter="url(#glow)">T:</text>
  
  <!-- CURITY 부분 (흰색) -->
  <text x="52" y="38" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">CURITY</text>
</svg>
